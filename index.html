<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Market POS & Stock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Firebase Compat Libraries -->
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-analytics-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>

    <!-- jsPDF and AutoTable for PDF Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>

    <style>
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; color: #1f2937; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .btn-press:active { transform: scale(0.95); transition: transform 0.1s; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.3); }
        
        @media print {
            body { background: white !important; }
        }
    </style>
</head>
<body class="h-[100dvh] w-[100vw] overflow-hidden flex flex-col selection:bg-teal-200">

    <div id="app" class="flex-1 w-full h-full relative transition-all duration-300 print:hidden overflow-hidden">
        <div class="flex h-full items-center justify-center">
            <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-teal-500"></div>
        </div>
    </div>

    <!-- Custom Modal Container (z-80 to ensure it appears above receipt if needed) -->
    <div id="modal-container" class="fixed inset-0 z-[80] hidden items-center justify-center bg-gray-900/40 backdrop-blur-sm transition-opacity opacity-0 print:hidden">
        <div id="modal-content" class="glass rounded-[2rem] p-8 max-w-sm w-full mx-4 shadow-2xl transform scale-95 transition-transform text-center">
            <div id="modal-icon" class="text-4xl mb-4 text-teal-500"><i class="fas fa-info-circle"></i></div>
            <h3 id="modal-title" class="text-xl font-bold mb-2">Notice</h3>
            <p id="modal-message" class="text-gray-600 mb-6 text-sm break-words">Message here</p>
            <div id="modal-actions" class="flex justify-center gap-3">
                <button id="modal-btn-ok" class="bg-teal-500 text-white px-6 py-2 rounded-full font-medium btn-press w-full">OK</button>
            </div>
        </div>
    </div>

    <!-- Receipt Modal Container -->
    <div id="receipt-overlay" class="fixed inset-0 z-[70] hidden items-center justify-center bg-gray-900/60 backdrop-blur-sm transition-opacity opacity-0 print:bg-white print:backdrop-blur-none print:items-start print:justify-start print:z-[100] print:opacity-100 print:block">
        <div class="bg-white p-6 rounded-[2rem] max-w-sm w-full mx-4 shadow-2xl transform transition-transform print:shadow-none print:w-full print:max-w-full print:m-0 print:p-4 print:rounded-none max-h-[90vh] overflow-y-auto no-scrollbar">
            
            <!-- Printable Area -->
            <div id="receipt-printable" class="text-gray-800 font-mono text-sm print:text-black">
                <!-- Receipt content injected dynamically -->
            </div>

            <!-- Actions (Hidden during print) -->
            <div class="mt-6 pt-4 border-t border-gray-100 flex flex-col gap-3 print:hidden">
                <div class="flex gap-2">
                    <button onclick="window.print()" class="flex-1 bg-teal-500 hover:bg-teal-600 text-white py-3 rounded-xl font-bold btn-press flex items-center justify-center gap-2 text-sm shadow-md shadow-teal-500/20">
                        <i class="fas fa-print"></i> Print
                    </button>
                    <button onclick="sendReceipt()" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-xl font-bold btn-press flex items-center justify-center gap-2 text-sm shadow-md shadow-blue-500/20">
                        <i class="fas fa-paper-plane"></i> Send
                    </button>
                </div>
                <button onclick="closeReceiptModal()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 py-3 rounded-xl font-bold btn-press text-sm border border-gray-200">
                    Done & Close
                </button>
            </div>
        </div>
    </div>

    <script>
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'demo-minimarket-app';
        
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCuGCsnjwYanHJbyDBQFf6zGOTCDSg0FkA",
            authDomain: "labclassbooking.firebaseapp.com",
            projectId: "labclassbooking",
            storageBucket: "labclassbooking.firebasestorage.app",
            messagingSenderId: "306586097223",
            appId: "1:306586097223:web:067973369a9abb427b8362",
            measurementId: "G-3XGBN13E04"
        };

        let app, db, auth, analytics, userId;
        
        let state = {
            view: 'home',
            products: [],
            cart: [],
            transactions: [],
            config: {
                systemEnabled: true,
                architectPin: '9999'
            },
            admins: [{ id: 'default', pin: '1234', name: 'Default Admin' }],
            currentRole: 'user' // 'user', 'admin', 'architect'
        };

        const appDiv = document.getElementById('app');
        const modalContainer = document.getElementById('modal-container');
        
        async function init() {
            try {
                firebase.initializeApp(firebaseConfig);
                analytics = firebase.analytics();
                db = firebase.firestore();
                auth = firebase.auth();

                await auth.signInAnonymously();

                auth.onAuthStateChanged((user) => {
                    if (user) {
                        userId = user.uid;
                        setupDataListeners();
                        setTimeout(render, 1000); 
                    }
                });
            } catch (error) {
                console.error("Init error:", error);
                showModal('System Error', 'Could not initialize database connection. ' + error.message, 'error');
            }
        }

        function getBasePath() {
            return `artifacts/${appId}/users/${userId}`;
        }

        function setupDataListeners() {
            if (!userId) return;

            db.collection(`${getBasePath()}/products`).onSnapshot((snapshot) => {
                state.products = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                if (state.view === 'cashier' || state.view === 'admin-inventory') render();
            });

            db.doc(`${getBasePath()}/settings/config`).onSnapshot((doc) => {
                if (doc.exists) {
                    const data = doc.data();
                    state.config.systemEnabled = data.systemEnabled ?? true;
                    if (!state.config.systemEnabled && state.currentRole !== 'architect') {
                        if (state.view !== 'admin-auth') navigate('home');
                    }
                } else {
                    db.doc(`${getBasePath()}/settings/config`).set({ systemEnabled: true });
                }
                render();
            });

            db.collection(`${getBasePath()}/settings/admins`).onSnapshot((snapshot) => {
                if (!snapshot.empty) {
                    state.admins = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                } else {
                    db.collection(`${getBasePath()}/settings/admins`).add({ pin: '1234', name: 'Manager' });
                }
                if (state.view === 'admin-architect') render();
            });
        }

        async function fetchAllTransactions() {
            if (!userId) return [];
            try {
                const txRef = db.collection(`${getBasePath()}/transactions`);
                const snapshot = await txRef.get();
                return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
            } catch (e) {
                console.error("Error fetching transactions", e);
                return [];
            }
        }

        // --- Custom Modals ---
        let modalResolve = null;
        function showModal(title, message, type = 'info', showCancel = false) {
            return new Promise((resolve) => {
                modalResolve = resolve;
                document.getElementById('modal-title').textContent = title;
                document.getElementById('modal-message').textContent = message;
                
                const icon = document.getElementById('modal-icon');
                icon.innerHTML = type === 'error' ? '<i class="fas fa-times-circle text-red-500"></i>' : 
                                 type === 'success' ? '<i class="fas fa-check-circle text-green-500"></i>' : 
                                 type === 'warning' ? '<i class="fas fa-exclamation-triangle text-orange-500"></i>' :
                                 '<i class="fas fa-info-circle text-teal-500"></i>';

                const actions = document.getElementById('modal-actions');
                if (showCancel) {
                    actions.innerHTML = `
                        <button id="modal-btn-cancel" class="bg-gray-200 text-gray-700 px-6 py-2 rounded-full font-medium btn-press w-full">Cancel</button>
                        <button id="modal-btn-confirm" class="bg-teal-500 text-white px-6 py-2 rounded-full font-medium btn-press w-full">Confirm</button>
                    `;
                    document.getElementById('modal-btn-cancel').onclick = () => closeModal(false);
                    document.getElementById('modal-btn-confirm').onclick = () => closeModal(true);
                } else {
                    actions.innerHTML = `<button id="modal-btn-ok" class="bg-teal-500 text-white px-6 py-2 rounded-full font-medium btn-press w-full">OK</button>`;
                    document.getElementById('modal-btn-ok').onclick = () => closeModal(true);
                }

                modalContainer.classList.remove('hidden');
                setTimeout(() => {
                    modalContainer.classList.remove('opacity-0');
                    document.getElementById('modal-content').classList.remove('scale-95');
                }, 10);
            });
        }

        function closeModal(result) {
            modalContainer.classList.add('opacity-0');
            document.getElementById('modal-content').classList.add('scale-95');
            setTimeout(() => {
                modalContainer.classList.add('hidden');
                if (modalResolve) modalResolve(result);
            }, 300);
        }

        window.showAuthModal = () => {
            return new Promise((resolve) => {
                const html = `
                    <div id="auth-overlay" class="fixed inset-0 z-[60] bg-gray-900/60 backdrop-blur-sm flex items-center justify-center opacity-0 transition-opacity">
                        <div id="auth-modal-content" class="bg-white p-6 rounded-[2rem] max-w-sm w-full mx-4 text-center transform scale-95 transition-transform shadow-2xl">
                            <i class="fas fa-lock text-3xl text-red-500 mb-3"></i>
                            <h3 class="text-xl font-bold mb-2">Manager Approval Required</h3>
                            <p class="text-sm text-gray-500 mb-4">Enter Admin or Architect PIN to remove or reduce item quantity.</p>
                            <input type="password" id="auth-pin-input" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-4 py-3 text-center tracking-[0.5em] text-2xl font-bold mb-2 focus:outline-none focus:ring-2 focus:ring-teal-500" placeholder="****" maxlength="4">
                            <p id="auth-error" class="text-red-500 text-xs h-4 mb-2"></p>
                            <div class="flex gap-3">
                                <button id="btn-auth-cancel" class="flex-1 bg-gray-200 text-gray-700 py-3 rounded-xl font-bold btn-press">Cancel</button>
                                <button id="btn-auth-confirm" class="flex-1 bg-teal-500 text-white py-3 rounded-xl font-bold btn-press">Approve</button>
                            </div>
                        </div>
                    </div>
                `;
                document.body.insertAdjacentHTML('beforeend', html);
                
                const overlay = document.getElementById('auth-overlay');
                const content = document.getElementById('auth-modal-content');
                const input = document.getElementById('auth-pin-input');
                const error = document.getElementById('auth-error');
                
                setTimeout(() => {
                    overlay.classList.remove('opacity-0');
                    content.classList.remove('scale-95');
                    input.focus();
                }, 10);

                const close = (result) => {
                    overlay.classList.add('opacity-0');
                    content.classList.add('scale-95');
                    setTimeout(() => {
                        overlay.remove();
                        resolve(result);
                    }, 300);
                };

                document.getElementById('btn-auth-cancel').onclick = () => close(false);
                
                const checkPin = () => {
                    const pin = input.value;
                    if (pin === state.config.architectPin || state.admins.some(a => a.pin === pin)) {
                        close(true);
                    } else {
                        error.textContent = 'Invalid PIN. Try again.';
                        input.value = '';
                        input.focus();
                    }
                };
                
                document.getElementById('btn-auth-confirm').onclick = checkPin;
                input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') checkPin();
                });
            });
        };

        // --- Receipt Logic ---
        function showReceiptModal(tx) {
            const overlay = document.getElementById('receipt-overlay');
            const content = document.getElementById('receipt-printable');
            
            let itemsHtml = tx.items.map(item => `
                <div class="flex justify-between text-[13px] mb-2">
                    <span class="truncate pr-2">${item.qty} x ${item.name}</span>
                    <span>RM${(item.price * item.qty).toFixed(2)}</span>
                </div>
            `).join('');

            content.innerHTML = `
                <div class="text-center mb-6">
                    <div class="w-12 h-12 bg-gray-100 rounded-full mx-auto mb-2 flex items-center justify-center text-xl print:hidden"><i class="fas fa-store text-gray-600"></i></div>
                    <h2 class="text-xl font-bold uppercase tracking-wider">Mini Market</h2>
                    <p class="text-xs text-gray-500 mt-1">Receipt #${tx.id.substring(0,8).toUpperCase()}</p>
                    <p class="text-xs text-gray-500">${new Date(tx.timestamp).toLocaleString()}</p>
                </div>
                <div class="border-t-2 border-b-2 border-dashed border-gray-200 py-4 mb-4">
                    ${itemsHtml}
                </div>
                <div class="flex justify-between font-bold text-base mb-6">
                    <span>TOTAL PAID</span>
                    <span>RM${tx.total.toFixed(2)}</span>
                </div>
                <div class="text-center text-xs text-gray-500 uppercase tracking-widest pb-4">
                    Thank you & Please come again!
                </div>
            `;

            overlay.classList.remove('hidden');
            setTimeout(() => { overlay.classList.remove('opacity-0'); }, 10);
        }

        window.closeReceiptModal = () => {
            const overlay = document.getElementById('receipt-overlay');
            overlay.classList.add('opacity-0');
            setTimeout(() => { overlay.classList.add('hidden'); }, 300);
        };

        window.sendReceipt = async () => {
            const contact = prompt("Enter Customer Email or Phone Number:");
            if (contact && contact.trim() !== "") {
                const btn = document.querySelector('button[onclick="sendReceipt()"]');
                const originalText = btn.innerHTML;
                btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> Sending...`;
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    showModal('Sent!', `The receipt has been successfully sent to ${contact}.`, 'success');
                }, 800);
            }
        };

        function navigate(view) {
            state.view = view;
            if (view === 'home' || view === 'admin-dash') state.cart = [];
            if (view === 'home') state.currentRole = 'user'; // Reset role on exit to home
            render();
        }

        function render() {
            if (!state.config.systemEnabled && state.currentRole !== 'architect' && state.view !== 'admin-auth') {
                renderSystemDisabled();
                return;
            }

            appDiv.innerHTML = '';
            switch (state.view) {
                case 'home': renderHome(); break;
                case 'cashier': renderCashier(); break;
                case 'admin-auth': renderAdminAuth(); break;
                case 'admin-dash': renderAdminDashboard(); break;
                case 'admin-inventory': renderAdminInventory(); break;
                case 'admin-architect': renderArchitectDash(); break;
                default: renderHome();
            }
        }

        function renderSystemDisabled() {
            appDiv.innerHTML = `
                <div class="h-full w-full flex flex-col items-center justify-center p-6 bg-gray-900 text-white text-center">
                    <i class="fas fa-lock text-6xl text-red-500 mb-6"></i>
                    <h1 class="text-3xl font-bold mb-2">System Disabled</h1>
                    <p class="text-gray-400 mb-8 max-w-md">The system has been disabled by the Architect. Please contact administration.</p>
                    <button onclick="navigate('admin-auth')" class="bg-gray-800 hover:bg-gray-700 px-6 py-3 rounded-full font-medium btn-press transition-colors">
                        <i class="fas fa-user-shield mr-2"></i> Architect Login
                    </button>
                </div>
            `;
        }

        // --- VIEW: HOME ---
        function renderHome() {
            const html = `
                <div class="h-full w-full flex flex-col items-center justify-center p-6 bg-gradient-to-br from-teal-50 to-gray-100">
                    <div class="bg-white p-10 rounded-[3rem] shadow-xl text-center max-w-md w-full relative">
                        ${!state.config.systemEnabled ? '<div class="absolute top-4 right-4 bg-red-100 text-red-600 text-xs px-3 py-1 rounded-full font-bold animate-pulse">Disabled</div>' : ''}
                        
                        <div class="w-24 h-24 bg-teal-100 text-teal-500 rounded-full flex items-center justify-center text-4xl mx-auto mb-6 shadow-inner">
                            <i class="fas fa-store"></i>
                        </div>
                        <h1 class="text-3xl font-bold mb-2 text-gray-800">Mini Market</h1>
                        <p class="text-gray-500 mb-8 text-sm">Select your workspace</p>
                        
                        <div class="space-y-4">
                            <button id="btn-go-cashier" class="w-full group relative flex items-center justify-between p-4 bg-gray-50 hover:bg-teal-50 rounded-full border border-gray-100 transition-colors btn-press">
                                <div class="flex items-center gap-4">
                                    <div class="w-10 h-10 rounded-full bg-teal-500 text-white flex items-center justify-center shadow-md">
                                        <i class="fas fa-cash-register"></i>
                                    </div>
                                    <span class="font-semibold text-gray-700 group-hover:text-teal-700">Cashier Register</span>
                                </div>
                                <i class="fas fa-chevron-right text-gray-400 group-hover:text-teal-500 pr-2"></i>
                            </button>

                            <button id="btn-go-admin" class="w-full group relative flex items-center justify-between p-4 bg-gray-50 hover:bg-gray-100 rounded-full border border-gray-100 transition-colors btn-press">
                                <div class="flex items-center gap-4">
                                    <div class="w-10 h-10 rounded-full bg-gray-800 text-white flex items-center justify-center shadow-md">
                                        <i class="fas fa-chart-pie"></i>
                                    </div>
                                    <span class="font-semibold text-gray-700">Admin Space</span>
                                </div>
                                <i class="fas fa-lock text-gray-400 pr-2 text-sm"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            appDiv.innerHTML = html;
            document.getElementById('btn-go-cashier').addEventListener('click', () => navigate('cashier'));
            document.getElementById('btn-go-admin').addEventListener('click', () => navigate('admin-auth'));
        }

        // --- VIEW: CASHIER ---
        function renderCashier() {
            const cartTotal = state.cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            
            const roleBtns = state.currentRole === 'user' 
                ? `<button id="btn-exit-cashier" class="px-4 h-10 rounded-full bg-red-50 text-red-600 flex items-center justify-center hover:bg-red-100 font-bold text-sm gap-2 btn-press">
                    <i class="fas fa-sign-out-alt"></i> Exit Cashier
                   </button>`
                : `<div class="flex gap-2">
                     <button id="btn-back-admin" class="px-4 h-10 rounded-full bg-gray-800 text-white flex items-center justify-center hover:bg-gray-700 font-bold text-sm gap-2 btn-press hidden sm:flex">
                        <i class="fas fa-chart-pie"></i> Admin Panel
                     </button>
                     <button id="btn-exit-cashier" class="px-4 h-10 rounded-full bg-red-50 text-red-600 flex items-center justify-center hover:bg-red-100 font-bold text-sm gap-2 btn-press">
                        <i class="fas fa-sign-out-alt"></i> Exit Main
                     </button>
                   </div>`;

            const html = `
                <div class="h-full w-full flex flex-col md:flex-row bg-gray-100">
                    <div class="flex-1 flex flex-col h-[55%] md:h-full overflow-hidden">
                        <div class="bg-white p-4 flex justify-between items-center shadow-sm z-10 rounded-b-3xl md:rounded-br-none md:rounded-r-3xl shrink-0">
                            ${roleBtns}
                            <h2 class="text-xl font-bold text-gray-800 hidden md:block">Register</h2>
                            <div class="w-10"></div>
                        </div>
                        <div class="flex-1 overflow-y-auto no-scrollbar p-4 md:p-6">
                            <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4" id="product-grid"></div>
                        </div>
                    </div>

                    <div class="w-full md:w-96 bg-white h-[45%] md:h-full flex flex-col shadow-[-10px_0_15px_-3px_rgba(0,0,0,0.05)] rounded-t-[2.5rem] md:rounded-l-[2.5rem] md:rounded-tr-none z-20 shrink-0">
                        <div class="p-6 pb-2 border-b border-gray-100 shrink-0">
                            <h3 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                                <div class="w-8 h-8 rounded-full bg-teal-100 text-teal-600 flex items-center justify-center"><i class="fas fa-shopping-basket text-sm"></i></div>
                                Current Order
                            </h3>
                        </div>
                        <div class="flex-1 overflow-y-auto no-scrollbar p-4 space-y-3" id="cart-items"></div>
                        <div class="p-4 md:p-6 bg-gray-50 rounded-t-3xl mt-auto border-t border-gray-100 shrink-0">
                            <div class="flex justify-between items-center mb-4">
                                <span class="text-gray-500 font-medium">Total</span>
                                <span class="text-3xl font-bold text-teal-600">RM${cartTotal.toFixed(2)}</span>
                            </div>
                            <button id="btn-checkout" class="w-full bg-teal-500 hover:bg-teal-600 text-white rounded-full py-4 font-bold text-lg shadow-lg shadow-teal-500/30 btn-press disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 transition-colors" ${state.cart.length === 0 ? 'disabled' : ''}>
                                <i class="fas fa-money-bill-wave"></i> <span>Pay (Cash Out)</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
            appDiv.innerHTML = html;
            
            document.getElementById('btn-exit-cashier').addEventListener('click', () => navigate('home'));
            if(document.getElementById('btn-back-admin')) {
                document.getElementById('btn-back-admin').addEventListener('click', () => navigate('admin-dash'));
            }
            document.getElementById('btn-checkout').addEventListener('click', handleCheckout);
            renderProductGrid();
            renderCartList();
        }

        function renderProductGrid() {
            const grid = document.getElementById('product-grid');
            if (state.products.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center text-gray-400 py-10">No products found.</div>`;
                return;
            }
            let gridHtml = '';
            state.products.forEach(p => {
                const isOutOfStock = p.stock <= 0;
                gridHtml += `
                    <div class="bg-white rounded-3xl p-3 shadow-sm hover:shadow-md transition-shadow cursor-pointer flex flex-col items-center text-center btn-press relative ${isOutOfStock ? 'opacity-50' : ''}" onclick="addToCart('${p.id}')">
                        ${isOutOfStock ? '<div class="absolute top-2 right-2 bg-red-100 text-red-600 text-xs px-2 py-1 rounded-full font-bold">Empty</div>' : ''}
                        <div class="w-16 h-16 rounded-full bg-gray-100 mb-3 overflow-hidden shadow-inner flex items-center justify-center">
                            ${p.image ? `<img src="${p.image}" class="w-full h-full object-cover">` : `<i class="fas fa-box text-gray-400 text-2xl"></i>`}
                        </div>
                        <h4 class="font-semibold text-gray-700 text-sm leading-tight mb-1 truncate w-full">${p.name}</h4>
                        <span class="text-teal-600 font-bold">RM${parseFloat(p.price).toFixed(2)}</span>
                        <span class="text-xs text-gray-400 mt-1">Stock: ${p.stock}</span>
                    </div>
                `;
            });
            grid.innerHTML = gridHtml;
        }

        window.addToCart = (id) => {

                return;

            if (existing) {
                existing.qty++;

            renderCashier();

        window.updateCartQty = async (index, change) => {
            const item = state.cart[index];
            const product = state.products.find(p => p.id === item.id);
            
            if (change < 0) {
                if (state.currentRole === 'user') {
                    const authorized = await showAuthModal();
                    if (!authorized) return;
                }
            } else if (change > 0 && item.qty >= product.stock) {
                showModal('Limit Reached', `Only ${product.stock} units available.`, 'info');
                return;
            }
            
            item.qty += change;
            if (item.qty <= 0) state.cart.splice(index, 1);
            renderCashier();
        };

        window.removeCartItem = async (index) => {
            if (state.currentRole === 'user') {

            renderCashier();

        async function handleCheckout() {
            if (state.cart.length === 0 || !userId) return;
            const total = state.cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            
            const confirmed = await showModal('Confirm Checkout', `Process payment of RM${total.toFixed(2)}?`, 'info', true);
            if (!confirmed) return;

            const btn = document.getElementById('btn-checkout');
            btn.innerHTML = `<i class="fas fa-circle-notch fa-spin"></i> Processing...`;
            btn.disabled = true;

            try {
                const txData = {
                    timestamp: new Date().toISOString(),
                    total: total,
                    items: state.cart.map(item => ({
                        id: item.id, name: item.name, price: item.price, cost: item.cost || 0, qty: item.qty
                    }))
                };
                
                const docRef = await db.collection(`${getBasePath()}/transactions`).add(txData);
                txData.id = docRef.id;

                for (const item of state.cart) {
                    const prodRef = db.doc(`${getBasePath()}/products/${item.id}`);
                    const prodDoc = await prodRef.get();
                    if (prodDoc.exists) {
                        const currentStock = prodDoc.data().stock || 0;
                        await prodRef.update({ stock: Math.max(0, currentStock - item.qty) });
                    }
                }
                
                state.cart = [];
                renderCashier();
                
                showReceiptModal(txData);

            } catch (error) {
                console.error("Checkout error:", error);
                showModal('Transaction Error', 'Failed to process checkout. Check connection.', 'error');
                btn.innerHTML = `<i class="fas fa-money-bill-wave"></i> <span>Pay (Cash Out)</span>`;
                btn.disabled = false;
            }
        }

        window.downloadPDF = async (period) => {
            const txs = await fetchAllTransactions();
            const now = new Date();
            let startDate = new Date();
            let title = "";

            if(period === 'day') {
                startDate = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                title = "Daily Sales Report";
            } else if (period === 'week') {
                startDate.setDate(now.getDate() - now.getDay());
                startDate.setHours(0,0,0,0);
                title = "Weekly Sales Report";
            } else if (period === 'month') {
                startDate = new Date(now.getFullYear(), now.getMonth(), 1);
                title = "Monthly Sales Report";
            } else if (period === 'year') {
                startDate = new Date(now.getFullYear(), 0, 1);
                title = "Yearly Sales Report";
            }

            const filtered = txs.filter(tx => new Date(tx.timestamp).getTime() >= startDate.getTime());
            
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            doc.setFontSize(18);
            doc.text(title, 14, 22);
            doc.setFontSize(11);
            doc.setTextColor(100);
            doc.text(`Generated on: ${now.toLocaleString()}`, 14, 30);

            const tableData = filtered.sort((a,b)=> new Date(b.timestamp) - new Date(a.timestamp)).map(tx => [
                tx.id.substring(0,8),
                new Date(tx.timestamp).toLocaleString(),
                tx.items ? tx.items.reduce((s, i)=>s+i.qty, 0) : 0,
                `RM ${tx.total.toFixed(2)}`
            ]);

            const totalRev = filtered.reduce((sum, tx) => sum + (tx.total || 0), 0);

            doc.autoTable({
                startY: 40,
                head: [['Sale ID', 'Date & Time', 'Total Items', 'Amount']],
                body: tableData,
                foot: [['', '', 'TOTAL REVENUE:', `RM ${totalRev.toFixed(2)}`]],
                theme: 'striped',
                headStyles: { fillColor: [20, 184, 166] },
                footStyles: { fillColor: [243, 244, 246], textColor: [31, 41, 55], fontStyle: 'bold' }
            });

            doc.save(`Sales_Report_${period}_${now.getTime()}.pdf`);
        };
